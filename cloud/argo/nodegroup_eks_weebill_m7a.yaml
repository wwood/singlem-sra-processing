apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: sandpiper
  region: us-east-1

# SELF-MANAGED nodegroup (nodeGroups:, not managedNodeGroups:). We need a per-node
# kubelet kubeReserved for ephemeral-storage (see below), and eksctl only exposes
# kubeletExtraConfig on self-managed nodegroups - AL2023 managed nodegroups can't set
# it. Functionally this is the same m7a.12xlarge spot fleet; it's just an eksctl/ASG
# nodegroup rather than an EKS "managed" one (eksctl scale nodegroup still works; you
# lose managed drain/upgrade, which this short-lived batch fleet doesn't use).
#
# NOTE: the eksctl CloudFormation stack name is eksctl-sandpiper-nodegroup-weebill-m7a
# for BOTH managed and self-managed, so DELETE the old managed weebill-m7a nodegroup
# before `eksctl create nodegroup -f` this, or give this one a new name.
nodeGroups:
  - name: weebill-m7a
    # Same 4th-gen AMD EPYC "Genoa" (Zen 4 / znver4) microarch as c7a, so the
    # -march=native image runs unchanged - NO rebuild. Do NOT substitute non-Genoa
    # parts (m6a Milan, Intel, Graviton) - they'd SIGILL on the AVX-512 build.
    #
    # m7a.12xlarge: 48 vCPU, 192 GiB (4 GiB/core). We switched here FROM c7a.12xlarge
    # (96 GiB) because c7a OOM-killed pods: at ~31 CPU-bound pods the memory-heavy
    # accession mix (per-pod actual RAM p90 ~4.2 GiB, max ~4.8 GiB, larger runs in
    # batch5) pushed node RAM to ~96% and the kernel OOM-killer fired. m7a keeps the
    # same CPU-bound packing (48 vCPU / 1500m cpu request ~= 32 pods) but 192 GiB
    # leaves real headroom: ~32 pods x ~4.8 GiB peak ~= 154 GiB ~= 80%, no OOM. The
    # template memory request stays 2800Mi - on m7a memory never binds before CPU
    # (192 GiB / 2800Mi ~= 70 >> 32), it just stops being the constraint. m7a spot is
    # a bit dearer than c7a (~$0.88-1.10 vs ~$0.81/hr) but the RAM is now actually used.
    # Self-managed spot is set via instancesDistribution (the managed-nodegroup
    # `spot: true` shorthand isn't valid here). Single instance type m7a.12xlarge,
    # 100% spot (onDemandBaseCapacity 0 / onDemandPercentageAboveBaseCapacity 0).
    # c7a.12xlarge added as a second spot pool: same Zen4/Genoa microarch (runs the
    # -march=native AVX-512 image unchanged), same 48 vCPU, but 96 GiB RAM (half of
    # m7a). It's a fallback so a single-pool m7a spot interruption stops taking the
    # fleet down and replacements can actually launch. Watch for OOMKills on c7a nodes
    # specifically (96 GiB leaves less peak headroom at ~32 CPU-bound pods).
    instancesDistribution:
      instanceTypes:
        - m7a.12xlarge
        - c7a.12xlarge
      onDemandBaseCapacity: 0
      onDemandPercentageAboveBaseCapacity: 0
      spotAllocationStrategy: capacity-optimized

    # Self-managed defaults to AmazonLinux2, which is unavailable on EKS >=1.33; pin
    # AL2023 to match the existing nodes (and so kubeletExtraConfig lands via nodeadm).
    amiFamily: AmazonLinux2023

    minSize: 0
    maxSize: 100
    desiredCapacity: 3

    # Reserve ephemeral-storage the scheduler would otherwise hand to pods. The
    # ~42 GiB .sylref + .syl2db hostPath cache (/mnt/weebill-ref-cache) plus container
    # images are real disk that no pod requests, so without this the scheduler
    # over-commits the root volume and nodes can hit DiskPressure/eviction. Reserving
    # 78 GiB drops allocatable ephemeral-storage by that much so pod bin-packing on
    # disk is honest. (Set only kubeReserved, not also systemReserved, or the two
    # would stack and reserve 156 GiB.)
    kubeletExtraConfig:
      kubeReserved:
        ephemeral-storage: "78Gi"

    # Single gp3 root volume per node holds the ~42 GiB .sylref + .syl2db cache and
    # every pod's concurrent .sra download. 700 GiB + 1000 MBps (gp3 max) + 6000 IOPS:
    # bumped from 500 GiB so per-pod ephemeral-storage *requests* stop being the binding
    # scheduling constraint before CPU (nodes were hitting ~96% disk-requested at ~63%
    # actual disk use, stranding CPU). 1000 MBps still feeds ~32 concurrent downloaders.
    volumeSize: 700
    volumeType: gp3
    volumeIOPS: 6000
    volumeThroughput: 1000
