apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: s2inglem-
  # labels:
  #   workflows.argoproj.io/archive-strategy: "false"
  annotations:
    workflows.argoproj.io/description: |
      A weebill workflow that processes RAW SRA reads (downloaded with kingfisher),
      but like the Logan workflow it takes MULTIPLE SRA accessions per pod invocation
      and loops over them one at a time. Unlike prod_workflow_template4.yaml there is
      no read chunking here - each accession is processed as a whole run.

      Per accession, with no intermediate fastq written to disk:
        kingfisher get                          -> $A.sra
        sracat-rs --single-out singles.fifo ...  > pairs.fifo   (one writer, two FIFOs)
        weebill sketch --merge --reference $REF --interleaved pairs.fifo --reads singles.fifo -d $A  -> $A.sylspr
        weebill profile --two-stage --reference $REF $SYL2DB $A.sylspr                               -> $A.profile.tsv (gzipped)
      sracat-rs streams interleaved paired reads to one FIFO and single/orphan reads
      to the other; `weebill sketch --merge` sketches each FIFO on its own thread (so
      both are drained concurrently and neither pipe deadlocks) and merges them into a
      single reference-compressed sample sketch (.sylspr). That sketch is then profiled
      with `weebill profile --two-stage` against the .syl2db two-stage database, and the
      resulting TSV is gzipped and uploaded. See the weebill_build_from_source
      Dockerfile in cloud/docker for the image.

      The .sylspr output is written against a weebill .sylref reference DB, and the
      profile step reads a .syl2db two-stage database. Both are large but seekable, so
      rather than baking them into the image or copying them per pod, the
      fetch-references initContainer downloads each once per node onto a hostPath cache
      (reference_s3_uri and syl2db_s3_uri) shared by every pod on the node; the sketch
      and profile steps then pread only the blocks each sample needs. Each file is
      guarded by its own lock (so a file lands once per node) and the initContainer
      randomises which file it fetches first, so that when many pods start together on a
      fresh node the two files download in parallel across pods rather than serially.

      Spot-safe, resumable, per-accession outputs. Each sketch, profile and log is
      uploaded to S3 directly as the accession finishes, NOT via an end-of-pod Argo
      artifact - so a spot interruption never loses already-completed work. At the top
      of the loop the pod skips any accession whose .sylspr is already in S3, so an Argo
      retry (on spot loss; retryPolicy Always) resumes at the interrupted accession
      instead of redoing the whole pod. The profile is uploaded BEFORE the sketch, so
      the sketch is the last object written for an accession - the skip check keys on it
      and thus only fires once both outputs are present. Outputs, all keyed per
      accession under {batch_name}/:
        sketches/$A.sylspr        successful sketch
        profiles/$A.profile.tsv.gz gzipped two-stage profile TSV
        logs/$A.log               log for every accession attempted
        failures/$A.log           copy of the log for accessions that failed (for diagnosis)
      A failed accession does not abort the pod, so its siblings still complete.

      To avoid a single node being overwhelmed by many large SRA downloads running in
      different pods at once, the pod requests ephemeral-storage proportional to the
      combined size of the accessions it will download (ephemeral_storage_mb). The k8s
      scheduler bin-packs pods by their resource requests, so a node whose disk is
      already "full" of ephemeral-storage requests will not have more download-heavy
      pods scheduled onto it. Because sracat-rs streams (no fastq temp files), the disk
      footprint is essentially just the .sra file being processed.
spec:
  entrypoint: singlem

  # Workflow-level arguments for every parameter referenced as
  # {{workflow.parameters.*}} below. Argo binds THESE onto the entrypoint
  # (singlem) template's inputs at runtime, overriding that template's own input
  # defaults - so this block, not the entrypoint inputs, is the authoritative
  # place a value must be set. Two submission paths set them:
  #   * `argo submit --parameter k=v` (e.g. setup_aws.bash --test-parameter for
  #     smoke tests) overrides any value here at submission time; and
  #   * slow_argo_submission_weebill.py textually substitutes the placeholder
  #     sentinel tokens below per submitted workflow (it submits many in one
  #     file with different accessions, so it cannot use a single --parameter).
  # The sentinels are deliberately not runnable defaults: a submission that
  # leaves one unset fails loudly rather than silently processing nothing. (The
  # disk-request quantity is applied via podSpecPatch on the singlem template,
  # not here - see the comment there for why a parameterised resources: field
  # fails validation.)
  arguments:
    parameters:
      - name: SRA_accession_num
        value: '__SRA_ACCESSION_NUM__' # Space-separated list of SRA accessions; set per submission.
      - name: batch_name
        value: '__BATCH_NAME__'
      - name: ephemeral_storage_mb
        value: '__EPHEMERAL_STORAGE_MB__' # Requested local disk (MiB); must be numeric for the quantity validator.
      - name: reference_s3_uri
        value: '__REFERENCE_S3_URI__' # s3:// URI of the weebill .sylref reference DB; set per submission.
      - name: syl2db_s3_uri
        # s3:// URI of the weebill .syl2db two-stage profiling database. Unlike the
        # sentinels above this carries a real default: it is a fixed companion to the
        # reference (matched r232 version), so submissions need not set it. Override
        # with `argo submit --parameter syl2db_s3_uri=...` if it ever changes.
        value: 's3://woodcrob-sandpiper-us-east-1/db/r232.100.syl2db'

  # Node-local cache for the weebill .sylref reference DB. hostPath is shared by
  # all pods on a node, so the reference is downloaded once per node (by the
  # fetch-reference initContainer) rather than once per pod. DirectoryOrCreate so
  # the path is created on first use.
  volumes:
    - name: ref-cache
      hostPath:
        path: /mnt/weebill-ref-cache
        type: DirectoryOrCreate

  podGC:
    # Pod GC strategy must be one of the following:
    # * OnPodCompletion - delete pods immediately when pod is completed (including errors/failures)
    # * OnPodSuccess - delete pods immediately when pod is successful
    # * OnWorkflowCompletion - delete pods when workflow is completed
    # * OnWorkflowSuccess - delete pods when workflow is successful
    # Default: do not delete pods
    strategy: OnPodSuccess
    # The duration before pods in the GC queue get deleted. Defaults to 5s
    # Requires Argo >= 3.5
    deleteDelayDuration: 1h

  templates:
    - name: singlem
      # Set the disk request via podSpecPatch rather than a resources: field.
      # Argo's spec validation runs the Kubernetes resource-quantity regex over
      # resources.requests/limits, and it rejects ANY {{...}} placeholder there
      # (it substitutes the literal "placeholder", giving "placeholderMi" ->
      # `quantities must match the regular expression ...`). podSpecPatch is an
      # opaque templated string that is merged into the pod at runtime and is
      # NOT quantity-validated at submit time, so a parameterised value works.
      # The container name in an Argo container template is always "main".
      podSpecPatch: |
        containers:
          - name: main
            resources:
              requests:
                ephemeral-storage: '{{inputs.parameters.ephemeral_storage_mb}}Mi'
      retryStrategy:
        # Always: retry on node-loss Errors (spot preemption), not just non-zero exits.
        # Retries are cheap here because the pod skips accessions already uploaded to S3,
        # so a higher limit just lets a repeatedly-preempted pod keep making progress.
        limit: "5"
        retryPolicy: "Always"
      inputs:
        parameters:
          - name: SRA_accession_num
            value: '{{workflow.parameters.SRA_accession_num}}' # Space separated list of SRA accession numbers
          - name: batch_name
            value: '{{workflow.parameters.batch_name}}'
          - name: ephemeral_storage_mb
            # Requested local disk for this pod, in MiB. Should be >= the combined
            # download+processing footprint of every accession in SRA_accession_num.
            # Used purely as a scheduler constraint so nodes are not overloaded.
            value: '{{workflow.parameters.ephemeral_storage_mb}}'
          - name: reference_s3_uri
            # s3:// URI of the weebill .sylref reference DB. Cached once per node on
            # a hostPath (see the fetch-references initContainer below) and read by
            # `weebill sketch --reference` to write .sylspr sketches directly.
            value: '{{workflow.parameters.reference_s3_uri}}'
          - name: syl2db_s3_uri
            # s3:// URI of the weebill .syl2db two-stage profiling database. Cached
            # once per node on the same hostPath as the reference (fetch-references
            # initContainer below) and read by `weebill profile --two-stage`.
            value: '{{workflow.parameters.syl2db_s3_uri}}'
      # Cache the (large) .sylref reference and .syl2db two-stage database on the
      # node's local disk exactly once each, shared by every pod that lands on this
      # node. Both are seekable, so the sketch/profile steps read only the blocks they
      # need via pread from these local copies.
      initContainers:
        - name: fetch-references
          image: 656626576102.dkr.ecr.us-east-1.amazonaws.com/singlem/sracat_weebill:v6
          volumeMounts:
            - name: ref-cache
              mountPath: /refcache
              # read-write: this container populates the cache
          env:
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: my-s3-credentials
                  key: accessKey
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: my-s3-credentials
                  key: secretKey
          command: [bash, -c]
          args:
            - |
              set -eo pipefail
              mkdir -p /refcache
              REF_URI='{{inputs.parameters.reference_s3_uri}}'
              SYL2DB_URI='{{inputs.parameters.syl2db_s3_uri}}'

              # Download one s3:// URI into the node-local cache. The cache path is
              # keyed on a hash of the FULL URI (not just the basename), so two files
              # that share a filename cannot collide on this node. A PER-FILE flock
              # means only downloads of the SAME file serialise (so it lands exactly
              # once per node); two DIFFERENT files can download concurrently.
              fetch() {
                local uri="$1"
                local dest="/refcache/$(printf %s "$uri" | sha256sum | cut -c1-16).$(basename "$uri")"
                (
                  flock 9
                  if [ -s "$dest" ]; then
                    echo "Already cached: $dest"
                  else
                    echo "Downloading $uri -> $dest"
                    aws s3 cp "$uri" "$dest.tmp" --only-show-errors
                    mv "$dest.tmp" "$dest"
                  fi
                  ls -lh "$dest"
                ) 9>"$dest.lock"
              }

              # Randomise which file this pod fetches first. When many pods start on a
              # fresh node together, per-file locks alone would still let them all queue
              # on the reference first (downloading it once, serially) and only then
              # start the syl2db. Randomising the lead file means different pods hold
              # different locks at the same time, so the reference and the syl2db
              # download in parallel across pods instead of one-after-the-other.
              if [ $((RANDOM % 2)) -eq 0 ]; then
                fetch "$REF_URI"; fetch "$SYL2DB_URI"
              else
                fetch "$SYL2DB_URI"; fetch "$REF_URI"
              fi
      container:
        image: 656626576102.dkr.ecr.us-east-1.amazonaws.com/singlem/sracat_weebill:v6
        volumeMounts:
          - name: ref-cache
            mountPath: /refcache
            readOnly: true
        # S3 credentials for the per-accession uploads below (same secret the
        # fetch-references initContainer and the artifact system use).
        env:
          - name: AWS_DEFAULT_REGION
            value: us-east-1
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: my-s3-credentials
                key: accessKey
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: my-s3-credentials
                key: secretKey
          # Let the AWS CLI retry transient S3 errors before we treat an upload as failed.
          - name: AWS_RETRY_MODE
            value: standard
          - name: AWS_MAX_ATTEMPTS
            value: "10"
        command: [bash,-c]
        args: ["
        echo workflow UID: {{workflow.uid}};
        echo date: `date`;
        REF=/refcache/`printf %s {{inputs.parameters.reference_s3_uri}} | sha256sum | cut -c1-16`.`basename {{inputs.parameters.reference_s3_uri}}`;
        SYL2DB=/refcache/`printf %s {{inputs.parameters.syl2db_s3_uri}} | sha256sum | cut -c1-16`.`basename {{inputs.parameters.syl2db_s3_uri}}`;
        ls -lh $REF $SYL2DB;
        S3=s3://woodcrob-sandpiper-us-east-1/{{inputs.parameters.batch_name}};
        mkdir -p logs sketches profiles;
        for A in {{inputs.parameters.SRA_accession_num}}; do
        if aws s3 ls $S3/sketches/$A.sylspr >/dev/null 2>&1; then echo skipping $A, already in S3; continue; fi;
        A=$A REF=$REF SYL2DB=$SYL2DB bash -e -o pipefail -c '
        echo processing $A on `date`;
        kingfisher get -r $A --output-format-possibilities sra --guess-aws-location --hide-download-progress -m aws-http prefetch;
        ls -lh $A.sra; free -h; df -h;
        mkfifo $A.pairs.fifo $A.singles.fifo;
        sracat-rs --eager-open-output --single-out $A.singles.fifo $A.sra > $A.pairs.fifo &
        sracat_pid=$!;
        weebill sketch -c 100 --tolerate-empty-inputs --merge --reference $REF --interleaved $A.pairs.fifo --reads $A.singles.fifo -S $A -d $A -t 4;
        wait $sracat_pid;
        mv $A.sylspr sketches/$A.sylspr;
        weebill profile --two-stage --reference $REF $SYL2DB sketches/$A.sylspr -o $A.profile.tsv -t 4;
        gzip $A.profile.tsv;
        mv $A.profile.tsv.gz profiles/$A.profile.tsv.gz;
        echo passed $A;
        ' 2>&1 | tee logs/$A.log;
        status=${PIPESTATUS[0]};
        if [ $status -ne 0 ]; then echo FAILED $A exit $status >> logs/$A.log; fi;
        aws s3 cp logs/$A.log $S3/logs/$A.log --quiet || echo WARN log upload failed for $A;
        if [ $status -eq 0 ]; then
        if aws s3 cp profiles/$A.profile.tsv.gz $S3/profiles/$A.profile.tsv.gz.tmp --only-show-errors && aws s3 mv $S3/profiles/$A.profile.tsv.gz.tmp $S3/profiles/$A.profile.tsv.gz --only-show-errors; then rm -f profiles/$A.profile.tsv.gz;
        if aws s3 cp sketches/$A.sylspr $S3/sketches/$A.sylspr.tmp --only-show-errors && aws s3 mv $S3/sketches/$A.sylspr.tmp $S3/sketches/$A.sylspr --only-show-errors; then rm -f sketches/$A.sylspr; else aws s3 rm $S3/sketches/$A.sylspr.tmp --quiet 2>/dev/null; echo WARN sketch upload failed for $A - keeping local copy and will exit non-zero to trigger retry; upload_failed=1; fi;
        else aws s3 rm $S3/profiles/$A.profile.tsv.gz.tmp --quiet 2>/dev/null; echo WARN profile upload failed for $A - NOT uploading sketch so the retry reprocesses instead of skipping; upload_failed=1; fi;
        else
        aws s3 cp logs/$A.log $S3/failures/$A.log --quiet || echo WARN failure-log upload failed for $A;
        fi;
        rm -f $A.sra $A.pairs.fifo $A.singles.fifo;
        echo workflow UID: {{workflow.uid}};
        done;
        if [ ${upload_failed:-0} -ne 0 ]; then echo one or more sketch uploads failed - exiting non-zero so Argo retries the pod, which resumes and skips already-uploaded accessions; exit 1; fi"
        ]
        resources:
          requests:
            memory: "3400Mi" # Scheduling request only (no memory limit set, so pods still burst past it). Bumped from 2800Mi to make MEMORY the binding constraint on the 96 GiB c7a.12xlarge fallback nodes, which were OOM-killing pods at ~32 pods/node (kernel OOM killer, no per-pod limit). c7a allocatable ~91.5 GiB / (3400 + 64Mi wait) ~= 26 pods/node - fewer pods, real RAM headroom. On m7a.12xlarge (192 GiB) CPU (1500m -> 31 pods) still binds first, so packing there is unchanged; only the cramped c7a nodes pack lighter.
            cpu: "1500m" # Whole-run processing like the Logan workflow; sketching is CPU bound.
            # ephemeral-storage (the file-size scheduling constraint described
            # above) is set via podSpecPatch at the top of this template, not
            # here, because a parameterised quantity fails Argo's validation.
      # No Argo output artifacts: each sketch/log is uploaded to S3 per accession
      # inside the loop (see the container args), so completed work survives a spot
      # interruption instead of only being uploaded on whole-pod success.
